<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doner volume</title>
<style>
  html, body { margin: 0; background: #292b47; color: #eceae3; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #stage {
    width: 800px; height: 400px; overflow: hidden; position: relative;
    background: #f8f8f8; color: #2b2b3a; user-select: none;
  }
  #kebab { position: absolute; left: 40px; top: 10px; height: 340px; image-rendering: pixelated; cursor: none; }
  #shears { position: absolute; width: 70px; pointer-events: none; display: none; }
  .meat { position: absolute; width: 36px; pointer-events: none; transition: top .6s ease-in; }
  #panel { position: absolute; right: 40px; top: 40px; width: 260px; }
  #vol { font-size: 56px; font-weight: bold; margin: 0; }
  #bar { height: 10px; background: #ddd; border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
  #fill { height: 100%; width: 0; background: #e07a3a; }
  button { font: inherit; color: #fff; background: #c0392b; border: 0; border-radius: 6px; padding: .6rem 1.2rem; cursor: pointer; }
  .hint { color: #777; font-size: 13px; }
</style>
</head>
<body>
<div id="stage">
  <img id="kebab" src="kebab1.png" alt="doner kebab">

  <svg id="shears" viewBox="0 0 100 40">
    <path d="M56 20 L74 28" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="83" cy="31" r="8" fill="none" stroke="#c0392b" stroke-width="5"/>
    <path d="M56 20 L74 12" stroke="#a93226" stroke-width="5" stroke-linecap="round"/>
    <circle cx="83" cy="9" r="8" fill="none" stroke="#a93226" stroke-width="5"/>
    <path d="M57 15 L2 20 L57 22 Z" fill="#dfe3ec" stroke="#8a909e"/>
    <path d="M57 25 L2 20 L57 18 Z" fill="#c9ceda" stroke="#8a909e"/>
    <circle cx="56" cy="20" r="3" fill="#4a4c5e"/>
  </svg>

  <div id="panel">
    <div class="hint">VOLUME</div>
    <p id="vol">0%</p>
    <div id="bar"><div id="fill"></div></div>
    <button id="make">make a kebab</button>
    <p class="hint">shave the doner to turn it up.<br>make a kebab to turn it down.</p>
  </div>
</div>
<script>
  const stage = document.getElementById('stage');
  const kebab = document.getElementById('kebab');
  const shears = document.getElementById('shears');
  const volText = document.getElementById('vol');
  const fill = document.getElementById('fill');

  const MAX_MEAT = 100;       // 1 piece of meat = 1% volume
  const KEBAB_COST = 25;      // "make a kebab" eats this much meat
  let meat = [];              // the dropped meat pieces (img elements)
  let hovering = false;

  // --- the doner turns: swap the two images
  let frame = 1;
  setInterval(() => {
    frame = frame === 1 ? 2 : 1;
    kebab.src = `kebab${frame}.png`;
  }, 250);

  // --- only the doner itself counts, not the white background around it
  const hitCanvas = document.createElement('canvas');
  const hitCtx = hitCanvas.getContext('2d', { willReadFrequently: true });
  function overMeat(e) {
    const r = kebab.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (x < 0 || y < 0 || x > r.width || y > r.height) return false;
    try {
      hitCanvas.width = kebab.naturalWidth; hitCanvas.height = kebab.naturalHeight;
      hitCtx.drawImage(kebab, 0, 0);
      const px = Math.floor(x / r.width * kebab.naturalWidth);
      const py = Math.floor(y / r.height * kebab.naturalHeight);
      const [red, green, blue, alpha] = hitCtx.getImageData(px, py, 1, 1).data;
      return alpha > 20 && (red + green + blue) < 690;   // near-white = background
    } catch (err) {
      // opened as a local file: the browser blocks pixel reading, so use the doner's rough shape
      const nx = x / r.width, ny = y / r.height;
      return ((nx - 0.46) / 0.16) ** 2 + ((ny - 0.43) / 0.23) ** 2 <= 1;
    }
  }

  // --- the shears follow the mouse
  stage.addEventListener('mousemove', e => {
    const s = stage.getBoundingClientRect();
    const scale = s.width / 800;
    const x = (e.clientX - s.left) / scale, y = (e.clientY - s.top) / scale;
    shears.style.left = (x - 2) + 'px';
    shears.style.top = (y - 14) + 'px';
    hovering = overMeat(e);
    shears.style.display = hovering || e.target === kebab ? 'block' : 'none';
    shears.lastX = x; shears.lastY = y;
  });
  stage.addEventListener('mouseleave', () => { hovering = false; shears.style.display = 'none'; });

  // --- while shaving, meat drops every so often
  setInterval(() => {
    if (!hovering || meat.length >= MAX_MEAT) return;
    const m = document.createElement('img');
    m.onerror = () => { // no meat.png yet: use a plain brown chunk instead
      m.onerror = null;
      m.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="36" height="14"><rect width="36" height="14" rx="5" fill="#b5602a" stroke="#6e3214" stroke-width="2"/></svg>');
    };
    m.src = 'meat.png';
    m.className = 'meat';
    m.style.left = (shears.lastX - 18) + 'px';
    m.style.top = shears.lastY + 'px';
    m.style.transform = `rotate(${Math.random() * 360}deg)`;
    stage.appendChild(m);
    // land in a pile on the floor under the doner
    const row = Math.floor(meat.length / 12);
    requestAnimationFrame(() => {
      m.style.left = (90 + Math.random() * 220) + 'px';
      m.style.top = (360 - row * 6 - Math.random() * 6) + 'px';
    });
    meat.push(m);
    update();
  }, 300);

  // --- the only way down: make a kebab out of a lot of meat
  document.getElementById('make').addEventListener('click', () => {
    const used = meat.splice(meat.length - Math.min(KEBAB_COST, meat.length));
    used.forEach(m => m.remove());
    update();
  });

  function update() {
    const v = Math.round(meat.length / MAX_MEAT * 100);
    volText.textContent = v + '%';
    fill.style.width = v + '%';
  }
</script>
</body>
</html>
